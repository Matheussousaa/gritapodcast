<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grita Podcast</title>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        background: #1a1a1a;
        color: #f0f0f0;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
    }

    nav {
        width: 100%;
        background: #0d0d0d;
        padding: 10px 0;
        box-shadow: 0 2px 5px rgba(0,0,0,0.5);
    }

    nav ul {
        display: flex;
        justify-content: center;
        gap: 20px;
        list-style: none;
        padding: 0;
        margin: 0;
    }

    nav a {
        color: #27ae60;
        text-decoration: none;
        font-weight: bold;
        transition: color 0.2s;
    }

    nav a:hover {
        color: #2ecc71;
    }

    header {
        margin: 20px 0;
    }

    header img {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        border: 3px solid #27ae60;
    }

    h1 {
        margin: 10px 0 5px 0;
        font-size: 2em;
        color: #27ae60;
    }

    h2 {
        font-weight: normal;
        font-size: 1.2em;
        color: #a0a0a0;
    }

    audio {
        margin: 20px 0;
        width: 90%;
        max-width: 500px;
    }

    footer {
        margin-top: auto;
        padding: 15px 0;
        width: 100%;
        background: #0d0d0d;
        color: #666;
    }

    footer a {
        color: #27ae60;
        margin: 0 10px;
        text-decoration: none;
    }

    footer a:hover {
        color: #2ecc71;
    }

    @media (max-width: 600px) {
        h1 {
            font-size: 1.5em;
        }

        h2 {
            font-size: 1em;
        }

        nav ul {
            flex-direction: column;
            gap: 10px;
        }

        audio {
            width: 100%;
        }
    }
</style>
</head>
<body>

<nav>
    <ul>
        <li><a href="https://www.instagram.com/gritapodcast/" target="_blank" rel="noopener noreferrer">Instagram</a></li>
        <li><a href="https://www.youtube.com/@GritaPodcast" target="_blank" rel="noopener noreferrer">YouTube</a></li>
    </ul>
</nav>

<header>
    <img src="channels4_profile.jpg" alt="Logo do Grita Podcast">
    <h1>O maior Podcast do Espírito Santo</h1>
    <h2>Siga a gente  em nossas redes sociais</h2>
</header>

<!-- Player de áudio moderno -->
<audio controls>
    <source src="audio-musica.mp3" type="audio/mpeg">
    Seu navegador não suporta o elemento de áudio.
</audio>

<footer>
    <a href="https://www.instagram.com/gritapodcast/" target="_blank" rel="noopener noreferrer">Instagram</a> |
    <a href="https://www.youtube.com/@GritaPodcast" target="_blank" rel="noopener noreferrer">YouTube</a>
</footer>

</body>
</html>
